# ============================================================================
#  Configuración de Rust para la aplicación de escritorio (Tauri 2)
# ============================================================================
[package]
name = "admincell-pro"
version = "1.0.0"
description = "Sistema comunitario multiplataforma de reportes de células"
authors = ["EarmLog"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "admincell_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
