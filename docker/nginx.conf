# Configuración de Nginx para servir la exportación estática de Next.js.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Soporta rutas con trailingSlash (carpeta/index.html)
  location / {
    try_files $uri $uri/ $uri/index.html /index.html;
  }

  # Cachea los recursos estáticos
  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
