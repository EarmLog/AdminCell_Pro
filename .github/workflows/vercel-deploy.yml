# ============================================================================
#  Despliegue en Vercel
# ----------------------------------------------------------------------------
#  Cada push a `main` compila la exportación estática y la publica en Vercel.
#  Requiere configurar estos secretos en el repositorio (Settings → Secrets):
#    - VERCEL_TOKEN       (token personal de Vercel)
#    - VERCEL_ORG_ID      (id de la organización/equipo)
#    - VERCEL_PROJECT_ID  (id del proyecto admincellpro)
# ============================================================================
name: Desplegar en Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  desplegar:
    name: Compilar y publicar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar y desplegar en Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
