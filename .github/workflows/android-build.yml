# ============================================================================
#  Compilación del APK de Android (Capacitor)
# ----------------------------------------------------------------------------
#  Compila la exportación web de Next.js, la sincroniza con el proyecto Android
#  de Capacitor y genera el APK de depuración como artefacto descargable.
# ============================================================================
name: Compilar Android (APK)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'next.config.js'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  compilar:
    name: Generar APK
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Preparar Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar el SDK de Android
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          fi

      - name: Instalar dependencias de Node
        run: npm ci

      - name: Compilar la web y sincronizar con Android
        run: npm run cap:sync

      - name: Dar permisos al wrapper de Gradle
        run: chmod +x android/gradlew

      - name: Compilar el APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: AdminCellPro-Android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
